  .phone {
    width: min(100%, 980px);
    min-height: 300px;
    padding: 42px 52px 48px;
    border-radius: 32px;
    background: rgba(0, 0, 0, 0.22);
    box-shadow: 0 18px 55px rgba(0,0,0,.18);
    backdrop-filter: blur(2px);
}
  h1 {
    margin: 0 0 28px;
    font-size: 30px;
    letter-spacing: -.7px;
    font-weight: 700;
  }
  .grid {
    display:grid;
    grid-template-columns:repeat(4, minmax(130px, 1fr));
    gap:18px;
    align-items:center;
}
  .app {
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:58px;
    padding:0 24px;
    border-radius:999px;
    color:#fff;
    text-decoration:none;
    font-size:17px;
    font-weight:600;
    letter-spacing:-.2px;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.32);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 8px 25px rgba(0,0,0,.22);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    transition:transform .18s ease, background .18s ease;
}
  .icon {
    width: 68px;
    height: 68px;
    border-radius: 17px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
    overflow: hidden;
    transition: transform .15s ease;
  }
  .app:hover .icon {
    transform: scale(1.07);
  }
  .icon img {
    width: 50px;
    height: 50px;
    object-fit: contain;
  }
  .name {
    max-width:none;
    text-align:center;
    white-space:nowrap;
    color:#fff;
}
.app:hover { transform:translateY(-2px); background:rgba(255,255,255,.24); }

.icon, .icon img { display:none !important; }
</style>
</head>
